name: Daily Italian Company News Search

on:
  # Run daily at 00:00 UTC (08:00 Beijing time)
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent deployment conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news search
        run: python main.py

      - name: Generate index page for GitHub Pages
        run: python scripts/generate_index.py

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: news-report-${{ github.run_id }}
          path: |
            data/*.html
            data/*.json
          retention-days: 90

      - name: Commit reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "Daily news report $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
